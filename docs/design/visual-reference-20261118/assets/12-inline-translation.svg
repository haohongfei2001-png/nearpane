<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1320" height="1240" viewBox="0 0 1320 1240" role="img"><title>Nearpane R4 visual reference - design sample, not a native screenshot</title><defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18"/></filter><filter id="winshadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#233649" flood-opacity=".15"/></filter><filter id="smallshadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e3247" flood-opacity=".15"/></filter><filter id="shellshadow" x="-35%" y="-10%" width="170%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#14212c" flood-opacity="0.08"/></filter><filter id="cardshadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14212c" flood-opacity="0.04"/></filter><clipPath id="x1"><rect x="0" y="0" width="754" height="574" rx="8" fill="white" fill-opacity="1" /></clipPath><clipPath id="x2"><rect x="52" y="820" width="754" height="284" rx="12" fill="white" fill-opacity="1" /></clipPath></defs><rect x="0" y="0" width="1320" height="1240" rx="0" fill="#f5f5f3" fill-opacity="1" /><text x="42" y="43" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="500" fill="#85909a" text-anchor="start" letter-spacing="1.8">NEARPANE / INLINE TRANSLATION</text><text x="42" y="84" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="550" fill="#29343b" text-anchor="start" >译文留在原词旁，回顾留在单词本。</text><text x="42" y="113" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#7d878e" text-anchor="start" >成功的主动查询自动记录。保持选区可见，不要求再次保存，不增加常驻翻译卡片。</text><g transform="translate(52 176)" filter="url(#winshadow)"><g clip-path="url(#x1)"><rect x="0" y="0" width="754" height="574" rx="0" fill="#fdfdfc" fill-opacity="1" /><rect x="0" y="0" width="754" height="32" rx="0" fill="#f3f4f5" fill-opacity="1" /><path d="M0 32L754 32" fill="none" stroke="#e0e4e7" stroke-width="0.7" stroke-opacity="1" stroke-linecap="round"/><circle cx="14" cy="16" r="4" fill="#e68177" fill-opacity="1"/><circle cx="27" cy="16" r="4" fill="#e6bd6c" fill-opacity="1"/><circle cx="40" cy="16" r="4" fill="#7cbf95" fill-opacity="1"/><text x="377" y="20" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#79848e" text-anchor="middle" >阅读资料</text><rect x="0" y="32" width="754" height="29" rx="0" fill="#fafbfc" fill-opacity="1" /><rect x="72" y="38" width="618" height="16" rx="4" fill="#eef0f2" fill-opacity="1" /><text x="377" y="49" font-family="Noto Sans CJK SC, sans-serif" font-size="8" font-weight="400" fill="#9aa3ad" text-anchor="middle" >design-notes.example / workspace</text><text x="28" y="102" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="550" fill="#35444e" text-anchor="start" >让工作，留在手边。</text><text x="28" y="126" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#7f8b94" text-anchor="start" >窗口、文字与刚刚留下的内容，在同一侧接续。</text><rect x="28" y="148" width="698" height="105" rx="7" fill="#dce5e8" fill-opacity="1" /><path d="M28 222Q263.9 160 726 213V253H28Z" fill="#b7cbd4"/><path d="M28 236Q377.0 194 726 239V253H28Z" fill="#97b4c3"/><text x="28" y="285" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="550" fill="#556671" text-anchor="start" >从清楚的边界开始</text><text x="28" y="311" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#8a969e" text-anchor="start" >一个安静的界面，让内容成为主角。</text><text x="28" y="330" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#8a969e" text-anchor="start" >需要时，回到刚才的窗口；有想法时，先把它记下来。</text></g></g><rect x="53" y="239" width="752" height="502" rx="0" fill="#FDFDFC" fill-opacity="1" /><text x="92" y="288" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="550" fill="#34423B" text-anchor="start" >Designing for continuity</text><text x="92" y="317" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#849087" text-anchor="start" >A quiet interface keeps attention on the work.</text><text x="92" y="364" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#56645A" text-anchor="start" >Good tools preserve</text><rect x="91" y="377" width="80" height="25" rx="3" fill="#DCE9E0" fill-opacity="1" /><text x="95" y="395" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#2C4937" text-anchor="start" >continuity</text><text x="177" y="395" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#56645A" text-anchor="start" >between one action and the next.</text><text x="92" y="442" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#849087" text-anchor="start" >Small, predictable actions make the next step feel natural.</text><path d="M92 472L766 472" fill="none" stroke="#E5E9E5" stroke-width="0.7" stroke-opacity="1" stroke-linecap="round"/><text x="92" y="509" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#8C9690" text-anchor="start" >阅读与操作之间，不必切换到另一块工具面板。</text><text x="92" y="533" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#8C9690" text-anchor="start" >需要了解一个词时，就在它旁边继续。</text><rect x="84" y="412" width="324" height="166" rx="15" fill="#FFFFFF" fill-opacity="1" stroke="#D5DED6" stroke-width="0.7" filter="url(#winshadow)"/><path d="M127 413l8-8 8 8" fill="#FFFFFF" stroke="#D5DED6" stroke-width=".7"/><path d="M128 413L142 413" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><text x="102" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="550" fill="#25272A" text-anchor="start" >continuity</text><text x="102" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#89918A" text-anchor="start" >名词</text><text x="102" y="498" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#364B3D" text-anchor="start" >连贯性；连续性</text><text x="102" y="522" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#77847A" text-anchor="start" >此处指操作与思路的自然接续。</text><path d="M102 538L390 538" fill="none" stroke="#E6EBE6" stroke-width="0.7" stroke-opacity="1" stroke-linecap="round"/><text x="102" y="561" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#526C59" text-anchor="start" >在单词本中查看</text><g transform="translate(375 550) scale(0.583333)" fill="none" stroke="#526C59" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8M17 12H3"/></g><text x="858" y="212" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="550" fill="#25272A" text-anchor="start" >查询发生在原词旁</text><text x="858" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >浮层跟随明确选中的文本，避让原词和屏幕边缘。用户仍在原来的阅</text><text x="858" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >读位置。</text><text x="858" y="372" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="550" fill="#25272A" text-anchor="start" >成功后自动留下记录</text><text x="858" y="405" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >一次成功结果对应一次查询；不增加保存按钮，不把流式片段存成多</text><text x="858" y="428" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >条。</text><text x="858" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="550" fill="#25272A" text-anchor="start" >侧栏维持原有结构</text><text x="858" y="565" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >翻译不占用新的常驻卡片。只有需要回顾时，再进入主窗口的单词</text><text x="858" y="588" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >本。</text><text x="52" y="794" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="550" fill="#25272A" text-anchor="start" >回顾时，保留这个词出现过的语境。</text><rect x="52" y="820" width="754" height="284" rx="12" fill="#FCFDFB" fill-opacity="1" stroke="#D7DED8" stroke-width="0.7" filter="url(#winshadow)"/><g clip-path="url(#x2)"><rect x="52" y="820" width="754" height="34" rx="0" fill="#F0F3EF" fill-opacity="1" /><circle cx="69" cy="837" r="3.8" fill="#DFA392" fill-opacity="1"/><circle cx="82" cy="837" r="3.8" fill="#D9C495" fill-opacity="1"/><circle cx="95" cy="837" r="3.8" fill="#AEC4AC" fill-opacity="1"/><text x="429" y="842" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#79847A" text-anchor="middle" >Nearpane · 单词本</text></g><rect x="53" y="854" width="174" height="240" rx="0" fill="#F4F6F2" fill-opacity="1" /><text x="71" y="889" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#8B958B" text-anchor="start" >最近查询</text><rect x="62" y="904" width="155" height="43" rx="8" fill="#E6ECE4" fill-opacity="1" /><text x="74" y="930" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="500" fill="#485D4B" text-anchor="start" >continuity</text><text x="255" y="900" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="550" fill="#314737" text-anchor="start" >continuity</text><text x="255" y="928" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#677A69" text-anchor="start" >连贯性；连续性</text><path d="M255 949L780 949" fill="none" stroke="#E3E9E0" stroke-width="0.7" stroke-opacity="1" stroke-linecap="round"/><text x="255" y="976" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#909A8E" text-anchor="start" >今天 09:41 · 阅读资料</text><text x="255" y="1005" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#586C5B" text-anchor="start" >Good tools preserve continuity between one action and the next.</text><text x="255" y="1067" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#8B9789" text-anchor="start" >同一词条可保留多次查询的时间与语境。</text><text x="858" y="870" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="550" fill="#25272A" text-anchor="start" >内容自动积累，来源保持清楚。</text><text x="858" y="904" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >原文、译文、查询时间与可得来源分开保存。重复查词可合并展示，</text><text x="858" y="927" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#68716F" text-anchor="start" >但新的语境不会被覆盖。</text><text x="858" y="1047" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#8A9290" text-anchor="start" >阅读窗口与单词本均为合成设计样本，未使用用户的浏览历史或真实文本。</text><path d="M42 1178L1278 1178" fill="none" stroke="#d9dfe1" stroke-width="0.8" stroke-opacity="1" stroke-linecap="round"/><text x="42" y="1203" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#7d888f" text-anchor="start" >交互设计样本；跨应用定位、翻译服务、焦点行为与记录持久化须分别完成原生验证。</text><text x="1278" y="1203" font-family="Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#8d979e" text-anchor="end" >NEARPANE / R4 / 2026.11.18</text></svg>