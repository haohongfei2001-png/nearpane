<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nearpane · Interaction Continuation Prototype</title>
<style>
:root{color-scheme:light;--ink:#20212a;--muted:#777987;--line:rgba(70,74,94,.13);--glass:rgba(249,249,253,.88);--accent:#7776d9;--shadow:0 18px 55px rgba(27,31,52,.18)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 78% 20%,#dce3f8 0,transparent 38%),linear-gradient(135deg,#e9edf5,#cfd6e5 48%,#e7e9f0);font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--ink);display:flex;justify-content:flex-end;align-items:center;padding:22px}
.desktop{position:fixed;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 40%,rgba(255,255,255,.2)),radial-gradient(ellipse at 20% 80%,rgba(255,255,255,.38),transparent 45%)}
.panel{position:relative;width:min(15vw,270px);min-width:222px;height:min(94vh,980px);min-height:650px;border:1px solid rgba(255,255,255,.78);border-radius:23px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.35);box-shadow:var(--shadow);padding:13px 12px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.core{height:38%;min-height:245px;display:flex;flex-direction:column;gap:9px;flex-shrink:0}
.voice{height:53%;min-height:128px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.73);padding:11px 11px 9px;display:flex;flex-direction:column;overflow:hidden}
.transcript{font-size:12px;line-height:1.55;color:#343541;flex:1;overflow:auto;min-height:0}
.transcript .dim{color:#989aa6}.voicefoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:7px}
.controls{display:flex;gap:7px;align-items:center}.pill{height:29px;min-width:36px;border:1px solid var(--line);border-radius:20px;background:#fff;display:grid;place-items:center;cursor:pointer;color:#626478}
.state{width:48px;height:29px;border:0;border-radius:20px;background:#ecebff;color:#6563bf;display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.state.ready .bar{width:4px;height:4px;border-radius:50%;background:#7776d9}.state.listening .bar{width:3px;border-radius:4px;background:#7776d9;animation:wave .45s ease-in-out infinite alternate}.state.listening .bar:nth-child(2){animation-delay:.1s}.state.listening .bar:nth-child(3){animation-delay:.2s}.state.paused .bar{display:none}.state.paused:after{content:'▶';font-size:11px}.state.disabled{background:#f0f0f2;color:#9698a4}.state.disabled:after{content:'Ⅱ';font-size:12px}
@keyframes wave{from{height:5px}to{height:17px}}
.tray{flex:1;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.63);padding:9px;display:flex;flex-direction:column;min-height:0}
.traytop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.traygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;min-height:0;flex:1}
.thumb{border-radius:8px;border:1px solid rgba(80,83,110,.16);background:linear-gradient(145deg,#f3f5fa,#dfe5f1);position:relative;overflow:hidden;cursor:pointer;min-height:42px}
.thumb:before{content:"";position:absolute;left:12%;top:16%;width:75%;height:12%;border-radius:3px;background:rgba(90,101,145,.2);box-shadow:0 12px 0 rgba(90,101,145,.12),0 24px 0 rgba(90,101,145,.09)}
.thumb:nth-child(2){background:linear-gradient(130deg,#f5f1ee,#d9e5e3)}.thumb:nth-child(3){background:linear-gradient(130deg,#eeeafa,#d6d8ed)}
.thumb.add{background:rgba(255,255,255,.55);display:grid;place-items:center;color:#7776c8;font-size:20px;border-style:dashed}
.thumb.selected{outline:2px solid var(--accent);outline-offset:-2px}
.spaces{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.space{flex:1;min-height:70px;border-radius:13px;border:1px solid rgba(77,82,110,.14);background:rgba(255,255,255,.48);padding:7px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;transition:border-color .18s,background .18s}
.space.active{border-color:rgba(111,109,207,.65);background:rgba(245,244,255,.8);box-shadow:inset 0 0 0 1px rgba(119,118,217,.12)}
.spacehead{display:flex;justify-content:space-between;color:#767987;font-size:10px;padding:0 2px}
.canvas{position:relative;flex:1;min-height:42px;border-radius:7px;background:linear-gradient(135deg,rgba(190,200,219,.25),rgba(255,255,255,.3));overflow:hidden}
.win{position:absolute;border:1px solid rgba(95,103,135,.27);border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(234,238,247,.9));box-shadow:0 2px 5px rgba(55,65,94,.1);cursor:pointer}
.win:before{content:"";height:5px;display:block;background:rgba(118,124,157,.15);border-radius:4px 4px 0 0}
.w1{left:3%;top:5%;width:47%;height:87%}.w2{left:52%;top:5%;width:45%;height:87%}.w3{left:3%;top:5%;width:63%;height:88%}.w4{left:68%;top:5%;width:29%;height:88%}.w5{left:24%;top:16%;width:53%;height:68%}
.spacesfoot{font-size:9px;color:#9698a4;text-align:center;padding-top:1px}
.moduleDock{position:absolute;right:18px;bottom:17px;display:flex;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.85);border-radius:15px;background:rgba(250,250,255,.9);box-shadow:0 5px 20px rgba(40,45,70,.12);backdrop-filter:blur(18px)}
.mod{width:29px;height:29px;border-radius:9px;border:0;background:transparent;color:#77788c;cursor:pointer;font-size:14px}.mod:hover,.mod.on{background:#eeedff;color:#6866c5}
.overlay{position:absolute;inset:12px;border-radius:18px;background:rgba(251,251,255,.97);backdrop-filter:blur(30px);box-shadow:0 10px 40px rgba(25,30,60,.2);border:1px solid white;z-index:5;padding:17px;display:none;flex-direction:column;gap:12px}
.overlay.show{display:flex}.overlayHead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#efeff5;border-radius:50%;width:27px;height:27px;cursor:pointer}
.moduleBody{font-size:12px;line-height:1.6;color:#4e5060}.moduleBody textarea{width:100%;height:130px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:#fff}.moduleBody button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;margin:4px 4px 0 0;cursor:pointer}
.status{font-size:10px;color:#8a8c98}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:15px;background:#292a36;color:white;font-size:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8}.toast.show{opacity:1}
@media(max-width:700px){body{padding:8px}.panel{width:86vw;height:96vh;min-width:0}.core{height:38%}}
</style></head>
<body><div class="desktop"></div>
<main class="panel" aria-label="Nearpane interaction prototype">
<div class="toast" id="toast"></div>
<section class="core">
  <div class="voice">
    <div class="transcript" id="transcript">我刚刚想到一个更简单的处理方式：<br>先保证主界面稳定，再把可选能力逐步加入。<br><span class="dim">语音结束后自然回到待命，文字流保持连续。</span></div>
    <div class="voicefoot">
      <span class="status" id="voiceStatus">待命</span>
      <div class="controls">
        <button class="pill" onclick="copyText()" title="复制文字">⧉</button>
        <button class="state ready" id="voiceButton" onclick="toggleVoice()" title="语音状态"><i class="bar"></i><i class="bar"></i><i class="bar"></i></button>
      </div>
    </div>
  </div>
  <div class="tray">
    <div class="traytop"><span class="status">截图暂存</span><span class="status" id="trayCount">2 / 4</span></div>
    <div class="traygrid" id="trayGrid">
      <div class="thumb" onclick="attachShot(this)" title="选择并附加截图"></div>
      <div class="thumb" onclick="attachShot(this)" title="选择并附加截图"></div>
      <div class="thumb add" onclick="capture()" title="捕获截图">＋</div>
    </div>
  </div>
</section>
<section class="spaces" id="spaces">
  <div class="space active" onclick="selectSpace(this,'桌面 1')"><div class="spacehead"><span>桌面 1</span><span>当前</span></div><div class="canvas"><div class="win w1" onclick="activateWindow(event,'窗口 A')"></div><div class="win w2" onclick="activateWindow(event,'窗口 B')"></div></div></div>
  <div class="space" onclick="selectSpace(this,'桌面 2')"><div class="spacehead"><span>桌面 2</span><span></span></div><div class="canvas"><div class="win w3" onclick="activateWindow(event,'主窗口')"></div><div class="win w4" onclick="activateWindow(event,'侧窗')"></div></div></div>
  <div class="space" onclick="selectSpace(this,'桌面 3')"><div class="spacehead"><span>桌面 3</span><span></span></div><div class="canvas"><div class="win w5" onclick="activateWindow(event,'浮动窗口')"></div></div></div>
  <div class="space" onclick="selectSpace(this,'桌面 4')"><div class="spacehead"><span>桌面 4</span><span></span></div><div class="canvas"><div class="win w1" onclick="activateWindow(event,'文档窗口')"></div></div></div>
  <div class="spacesfoot">真实空间几何映射 · 原型合成数据</div>
</section>
<nav class="moduleDock" aria-label="用户模块">
<button class="mod" onclick="openModule('AI 助手','用户明确选择文本或截图后，才将其作为上下文。这里是独立的轻量助手表面。')" title="AI 助手">✳</button>
<button class="mod" onclick="openNotes()" title="便签">▤</button>
<button class="mod" onclick="openModule('待办','下一项：完成 Nearpane 架构文档。\n点击操作仅演示模块展开，不会写入真实任务。')" title="待办">✓</button>
<button class="mod" onclick="openModule('日历','下一场日程\n14:30 · 项目评审\n\n日历内容为合成演示数据。')" title="日历">▦</button>
<button class="mod" onclick="openModule('天气','天津 · 18°\n多云\n\n天气为合成演示数据。')" title="天气">☼</button>
</nav>
<div class="overlay" id="overlay"><div class="overlayHead"><strong id="moduleTitle">模块</strong><button class="close" onclick="closeModule()">×</button></div><div class="moduleBody" id="moduleBody"></div><div class="status" style="margin-top:auto">模块展开不改变底层 Space 几何；所有数据均为合成演示内容。</div></div>
</main>
<script>
let voice='ready',shots=2;
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
function toggleVoice(){const b=document.getElementById('voiceButton'),s=document.getElementById('voiceStatus');if(voice==='ready'){voice='listening';b.className='state listening';s.textContent='正在识别'}else if(voice==='listening'){voice='paused';b.className='state paused';s.textContent='已暂停'}else{voice='ready';b.className='state ready';s.textContent='待命'}}
function copyText(){toast('已复制当前文字流（演示）')}
function attachShot(el){if(el.classList.contains('add'))return;el.classList.toggle('selected');toast('选择截图并附加到已确认草稿（演示）')}
function capture(){if(shots>=4){toast('队列已满');return}shots++;const g=document.getElementById('trayGrid'),n=document.createElement('div');n.className='thumb';n.onclick=()=>attachShot(n);g.insertBefore(n,g.children[g.children.length-1]);document.getElementById('trayCount').textContent=shots+' / 4';toast('截图进入暂存队列（演示）')}
function selectSpace(el,name){document.querySelectorAll('.space').forEach(x=>{x.classList.remove('active');x.querySelector('.spacehead span:last-child').textContent=''});el.classList.add('active');el.querySelector('.spacehead span:last-child').textContent='当前';toast('切换到'+name+'（合成演示）')}
function activateWindow(e,name){e.stopPropagation();toast('激活'+name+'（合成演示）')}
function openModule(name,body){document.getElementById('moduleTitle').textContent=name;document.getElementById('moduleBody').textContent=body;document.getElementById('overlay').classList.add('show')}
function openNotes(){document.getElementById('moduleTitle').textContent='便签';document.getElementById('moduleBody').innerHTML='<textarea placeholder="记录一个想法…">Nearpane：让桌面空间与常用能力自然地在一起。</textarea><div><button onclick="toast(\'已保存便签（演示）\')">保存</button><button onclick="closeModule()">完成</button></div>';document.getElementById('overlay').classList.add('show')}
function closeModule(){document.getElementById('overlay').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModule()});
</script></body></html>
