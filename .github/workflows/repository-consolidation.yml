name: One-time repository consolidation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-consolidation.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: repository-consolidation
  cancel-in-progress: false
jobs:
  retire-historical-refs:
    if: github.ref == 'refs/heads/main' && github.repository == 'haohongfei2001-png/nearpane'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Verify recoverable history, then delete only exact retired tips
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA: '3b2ae003286b9a787a852d2a5f6bc674a6bb4649'
          ARCHIVE_TAG: 'archive/pre-consolidation-20261128'
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; anchor=os.environ['ARCHIVE_SHA']; tag=os.environ['ARCHIVE_TAG']
          def call(*args): return subprocess.check_output(args, text=True).strip()
          def api(path): return json.loads(call('gh','api',f'repos/{repo}/{path}'))
          commit=api(f'git/commits/{anchor}')
          manifest=json.loads(base64.b64decode(api(f'contents/branches.json?ref={anchor}')['content']))
          keep={x['branch'] for x in manifest['retained']}
          retired={x['branch']:x['sha'] for x in manifest['retired']}
          assert len(retired)==28 and 'main' in keep and not (keep & retired.keys())
          assert {p['sha'] for p in commit['parents']} == {manifest['main'],*retired.values()}, 'archive ancestry mismatch'
          ref='refs/tags/'+tag
          existing=call('git','ls-remote','--refs','origin',ref)
          if not existing:
              call('gh','api','--method','POST',f'repos/{repo}/git/refs','-f',f'ref={ref}','-f',f'sha={anchor}')
          assert api('git/ref/tags/'+tag)['object']['sha']==anchor, 'archive tag mismatch'
          active=api('pulls?state=open&per_page=100')
          assert len(active)<100, 'open PR list incomplete'
          protected={r[k]['ref'] for r in active for k in ('head','base') if r[k].get('repo') and r[k]['repo']['full_name']==repo}
          live={line.split('\t')[1].removeprefix('refs/heads/'):line.split('\t')[0] for line in call('git','ls-remote','--heads','origin').splitlines()}
          delete={name:sha for name,sha in retired.items() if live.get(name)==sha and name not in protected}
          skipped={name:live.get(name) for name,sha in retired.items() if name in live and name not in delete}
          if delete:
              args=['git','push','--atomic']+['--force-with-lease=refs/heads/'+n+':'+s for n,s in delete.items()]+['origin']+[':refs/heads/'+n for n in delete]
              subprocess.run(args,check=True)
          remaining=call('git','ls-remote','--heads','origin')
          for n in delete: assert ('refs/heads/'+n) not in [l.split('\t')[1] for l in remaining.splitlines()]
          for n in keep: assert ('refs/heads/'+n) in [l.split('\t')[1] for l in remaining.splitlines()]
          print(f'Archive {tag} -> {anchor}; deleted {len(delete)} exact old refs; changed/protected skipped: {skipped}')
          print(remaining)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'Archive verified: {tag} -> {anchor}\n\nDeleted {len(delete)} exact historical branch refs.\n\nChanged or protected: {skipped}\n\nRemaining branch refs:\n```\n{remaining}\n```\n')
          if skipped: raise SystemExit('Some old refs changed or acquired an open PR; retained.')
          PY
