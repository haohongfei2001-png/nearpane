name: Nearpane unified workbench
on:
  push:
    branches: [pro/r4-integrated-lyrics-20261128]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-lyrics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test Host, module lifecycle and existing integration
        env:
          NEARPANE_ROSTER_SAMPLE_DIR: ${{ github.workspace }}/build/unified-workbench-evidence/current-render-samples
        run: |
          mkdir -p "$NEARPANE_ROSTER_SAMPLE_DIR"
          set -o pipefail
          bash scripts/test.sh --no-parallel 2>&1 | tee build/unified-workbench-evidence/swift-tests.log
      - name: Preserve test diagnostics before packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: Nearpane-workbench-test-diagnostics
          path: |
            build/unified-workbench-evidence/swift-tests.log
            build/unified-workbench-evidence/current-render-samples
          if-no-files-found: warn
      - name: Compile and package integrated Nearpane
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bash scripts/build-app.sh debug 2>&1 | tee build/unified-workbench-evidence/build.log
          python3 -B scripts/verify-packages.py build/debug/Nearpane.app 2>&1 | tee build/unified-workbench-evidence/package-verification.log
      - name: Exercise and capture the native main window and sidebar
        if: ${{ !cancelled() && hashFiles('build/debug/Nearpane.app/Contents/MacOS/NearpaneHost') != '' }}
        run: python3 -B scripts/acceptance/unified-workbench/run.py build/debug/Nearpane.app
      - name: Probe real Apple Music pause, resume and exit when available
        if: ${{ !cancelled() && hashFiles('build/unified-workbench-evidence/runner-receipt.json') != '' }}
        run: python3 -B scripts/acceptance/unified-workbench/native_player.py
      - name: Preserve native diagnostics before baseline comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && hashFiles('build/unified-workbench-evidence/runner-receipt.json') != '' }}
        with:
          name: Nearpane-workbench-native-diagnostics
          path: |
            build/unified-workbench-evidence/native
            build/unified-workbench-evidence/native-workbench.log
            build/unified-workbench-evidence/runner-receipt.json
            build/unified-workbench-evidence/real-player
          if-no-files-found: warn
      - name: Archive Host candidate
        if: ${{ !cancelled() && hashFiles('build/debug/Nearpane.app/Contents/MacOS/NearpaneHost') != '' }}
        run: ditto -c -k --keepParent build/debug/Nearpane.app Nearpane-integrated-lyrics.zip
      - name: Compare existing Spaces tests with the original PR 16 baseline
        if: ${{ !cancelled() }}
        run: python3 -B scripts/acceptance/unified-workbench/baseline.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && hashFiles('Nearpane-integrated-lyrics.zip') != '' }}
        with:
          name: Nearpane-integrated-lyrics
          path: Nearpane-integrated-lyrics.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Nearpane-unified-workbench-evidence
          path: build/unified-workbench-evidence
          if-no-files-found: warn
