name: One-time historical evidence dependency audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-evidence-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check historical evidence references from tracked implementation and current documents
        run: |
          python3 - <<'PY'
          import subprocess, re
          patterns = r'engineering/verification/(native-spaces|window-engine|stage-groups/5\.22-90|product-value-5\.22)|verification/(native-spaces|window-engine|stage-groups/5\.22-90|product-value-5\.22)|native-spaces/archive|design/archive|research/archive|archive/[^ )]*pre-independent|DELIVERY-AND-VERIFICATION\.md|nearpane-interaction-prototype\.html|5\.21-(74|75|76|77|78|80|82|85|86)|5\.22-90-(active-display-previews|installed-contract|sidebar-pair|window-roster)|single-version-26A428'
          scopes=['Sources','Products','Engine','Tests','Resources','Dependencies','scripts','tools','Package.swift','.github/workflows']
          def grep(label, paths):
              result=subprocess.run(['git','grep','-I','-n','-E',patterns,'--',*paths],text=True,capture_output=True)
              assert result.returncode in (0,1), result.stderr
              lines=[l[:450] for l in result.stdout.splitlines() if 'repository-evidence-audit.yml:' not in l]
              print(f'{label}: {len(lines)} matches')
              for line in lines[:150]: print(line)
          grep('IMPLEMENTATION',scopes)
          grep('CURRENT_DOCS',['README.md','AGENTS.md','PRODUCT_CONSTITUTION.md','docs/design','docs/verification','engineering/research/NEARPANE-INDEPENDENT-STAGE-DECISION.md','engineering/verification/independent-stage/README.md','engineering/native-spaces/STATUS.md'])
          PY
