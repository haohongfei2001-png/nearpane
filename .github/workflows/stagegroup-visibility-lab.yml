name: StageGroup window visibility research
on:
  push:
    branches: [codex/r4-native-candidate-20261120]
    paths:
      - ".github/workflows/stagegroup-visibility-lab.yml"
      - "engineering/verification/stage-groups/visibility-feasibility/poc/**"
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-26, xcode-27]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Probe enrolled window owners in the disposable GUI
        run: python3 -B engineering/verification/stage-groups/visibility-feasibility/poc/run.py "$RUNNER_TEMP/window-visibility"
      - name: Preserve all observations including failed cases
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visibility-${{ matrix.image }}
          path: ${{ runner.temp }}/window-visibility
          if-no-files-found: error
          retention-days: 14
