name: Nearpane film v2 second real player
on:
  push:
    branches: [creative/nearpane-film-v2-source2-20261128]
    paths:
      - Marketing/FirstFilmV2/source2/**
      - .github/workflows/film-v2-source2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: film-v2-source2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Stage independent source2 camera
        run: |
          mkdir -p build/film-v2-source2
          python3 Marketing/FirstFilmV2/source2/stage_source2.py Marketing/FirstFilmV2/native "$RUNNER_TEMP/source2-harness"
          cp "$RUNNER_TEMP/source2-harness/source2-staging.json" build/film-v2-source2/
          python3 "$RUNNER_TEMP/source2-harness/prepare_film_package.py" . "$RUNNER_TEMP/source2-package"
          cp "$RUNNER_TEMP/source2-package/source-manifest.json" build/film-v2-source2/
          command -v ffmpeg || brew install ffmpeg
      - name: Build actual product view and real screen recorder
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/source2-harness/build_camera_app.py" "$RUNNER_TEMP/source2-package" "$RUNNER_TEMP/Nearpane Film V2.app" 2>&1 | tee build/film-v2-source2/build.log
          swiftc -parse-as-library -swift-version 5 -O "$RUNNER_TEMP/source2-harness/FilmAVCapture.swift" -framework AppKit -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia -o "$RUNNER_TEMP/source2-recorder" 2>&1 | tee build/film-v2-source2/recorder-build.log
          swiftc -swift-version 5 -O "$RUNNER_TEMP/source2-harness/place_source2_window.swift" -framework AppKit -framework ApplicationServices -o "$RUNNER_TEMP/source2-place-window" 2>&1 | tee build/film-v2-source2/placement-build.log
      - name: Prepare licensed recording and actual 4K desktop
        run: |
          python3 "$RUNNER_TEMP/source2-harness/build_good_to_go.py" --output "$RUNNER_TEMP/good-to-go.m4a" --source-dir "$RUNNER_TEMP/song-originals" > build/film-v2-source2/audio-source.json
          python3 Marketing/FirstFilmV2/source2/build_qq_compatibility.py --alac "$RUNNER_TEMP/good-to-go.m4a" --cover "$RUNNER_TEMP/song-originals/simple-life-cover.jpg" --output "$RUNNER_TEMP/good-to-go-source2.mp3" --evidence build/film-v2-source2
          python3 "$RUNNER_TEMP/source2-harness/set_motion_preference.py" build/film-v2-source2
          python3 "$RUNNER_TEMP/source2-harness/prepare_hidpi.py" build/film-v2-source2
          defaults write com.apple.dock autohide -bool true
          killall Dock || true
      - name: Record actual official QQ Music and live lyrics
        run: |
          python3 "$RUNNER_TEMP/source2-harness/drive_source2_capture.py" --app "$RUNNER_TEMP/Nearpane Film V2.app" --audio "$RUNNER_TEMP/good-to-go-source2.mp3" --wallpaper Marketing/FirstFilmV2/assets/workspace/morning-water-photography.jpg --recorder "$RUNNER_TEMP/source2-recorder" --placement-helper "$RUNNER_TEMP/source2-place-window" --output build/film-v2-source2
          ffprobe -v error -show_streams -show_format -of json build/film-v2-source2/source2-fullscreen.mov > build/film-v2-source2/media-probe.json
      - name: Preserve actual frames audio readbacks or bounded failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nearpane-film-v2-real-source2
          path: build/film-v2-source2
          retention-days: 30
          if-no-files-found: warn
