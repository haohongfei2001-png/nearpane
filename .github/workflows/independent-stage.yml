name: Independent Stage replacement
on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: 'Run controlled WindowServer diagnostics without source tests or a product candidate'
        type: boolean
        default: false
  push:
    branches: ['pro/independent-stage-engine-20261126']
permissions:
  contents: read
jobs:
  implementation:
    name: Independent Stage (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ inputs.diagnostics_only == true && fromJSON('["diagnostics"]') || fromJSON('["full", "diagnostics"]') }}
    concurrency:
      group: independent-stage-${{ github.ref }}-${{ github.event_name }}-${{ matrix.lane }}-${{ matrix.lane == 'full' && github.run_id || 'sequential' }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      NEARPANE_RUN_ID: independent-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      NEARPANE_HOSTED_PLATFORM_ONLY: ${{ matrix.lane == 'diagnostics' && '1' || '0' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Identify the actual host
        run: |
          sw_vers
          uname -m
          csrutil status
          cargo --version
          swift --version
      - name: Rust, FFI, group lifecycle and R4 integration source tests
        if: ${{ matrix.lane == 'full' }}
        run: python3 -B scripts/acceptance/independent-stage/run.py "$RUNNER_TEMP/independent-source" --scope source
      - name: Publish read-only console context immediately
        if: ${{ !cancelled() && matrix.lane == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nearpane-independent-context-${{ github.sha }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/independent-source/summary.json
            ${{ runner.temp }}/independent-source/source/summary.json
            ${{ runner.temp }}/independent-source/source/windowserver-context.json
            ${{ runner.temp }}/independent-source/source/read-only-context*.log
            ${{ runner.temp }}/independent-source/source/probe-build*.log
            ${{ runner.temp }}/independent-source/source/swift.stderr.log
            ${{ runner.temp }}/independent-source/source/swift.log
            ${{ runner.temp }}/independent-source/source/build-spaces-worker.stderr.log
          if-no-files-found: warn
          retention-days: 30
      - name: Build complete candidate with embedded tools
        id: candidate
        if: ${{ !cancelled() && matrix.lane == 'full' }}
        run: |
          bash scripts/build-app.sh release
          app="$PWD/build/standalone.$NEARPANE_RUN_ID/products/release/Nearpane.app"
          # build-app verifies its standalone development image before assembling
          # resources. Seal and verify the complete candidate in its bundle context.
          workspace="$RUNNER_TEMP/NearpaneIndependentStage.app"
          python3 -B scripts/acceptance/independent-stage/package.py "$app" "$workspace" --revision "$GITHUB_SHA" --mode workspace
          codesign --verify --strict --deep "$workspace"
          ditto -c -k --keepParent "$workspace" "$RUNNER_TEMP/Nearpane-independent-candidate.zip"
          shasum -a 256 "$RUNNER_TEMP/Nearpane-independent-candidate.zip" > "$RUNNER_TEMP/Nearpane-independent-candidate.sha256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          source_path = root / 'independent-source/summary.json'
          source = json.loads(source_path.read_text()).get('source') if source_path.exists() else None
          receipt = {'schema': 1, 'revision': os.environ['GITHUB_SHA'],
                     'sourceChecks': source.get('status', 'UNKNOWN') if isinstance(source, dict) else 'UNKNOWN',
                     'fullBuild': 'PASS', 'bundleSignature': 'PASS', 'qualificationGranted': False}
          (root / 'Nearpane-independent-candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          printf 'app=%s\n' "$app" >> "$GITHUB_OUTPUT"
      - name: Foreign-window Spaces and production R4 receipts
        if: ${{ !cancelled() }}
        run: |
          arguments=("$RUNNER_TEMP/independent-runtime" --scope runtime --iterations 3)
          if [[ '${{ steps.candidate.outcome }}' == success ]]; then
            arguments+=(--product-host '${{ steps.candidate.outputs.app }}')
          fi
          python3 -B scripts/acceptance/independent-stage/run.py "${arguments[@]}"
      - name: Compile native rendering-decoupling diagnostic
        if: ${{ !cancelled() && matrix.lane == 'diagnostics' }}
        run: |
          if [ -f tools/native-stage-decoupling/probe.m ]; then
            xcrun clang -fobjc-arc -fblocks -Wall -Wextra -O1 tools/native-stage-decoupling/probe.m -framework AppKit -framework ApplicationServices -o "$RUNNER_TEMP/native-stage-inspect"
          fi
      - name: Observe native rendering and edge invocation after Spaces cleanup
        if: ${{ !cancelled() && matrix.lane == 'diagnostics' }}
        timeout-minutes: 10
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'native-stage-cloud'
          output.mkdir()
          runtime_file = root / 'independent-runtime/runtime/summary.json'
          runtime = json.loads(runtime_file.read_text()) if runtime_file.exists() else {}
          engine = runtime.get('engineReceipt') or {}
          product = runtime.get('productReceipt') or {}
          workspace = runtime.get('ciWorkspaceCleanup') or {}
          preparation = runtime.get('ciWorkspacePreparation') or {}
          crash = product.get('hostCrashReceipt') or {}
          platform_diagnostic = runtime.get('platformDiagnosticReceipt') or {}
          untouched_workspace = (preparation.get('status') == 'NOT_RUN'
                  and preparation.get('reason') == 'hostedPlatformMechanismUsesOriginalDesktop'
                  and preparation.get('desktopPreparationExecuted') is False
                  and preparation.get('nativeDesktopInputs') == 0
                  and preparation.get('workspaceUnchanged') is True)
          safe = (((workspace.get('cleanup') is True and workspace.get('status') == 'READY') or untouched_workspace)
                  and (engine.get('cleanup') is True or engine.get('phase') == 'ciWorkspacePreparation')
                  and (not product or product.get('cleanup') is True)
                  and (not crash or crash.get('cleanup') is True)
                  and (not platform_diagnostic or platform_diagnostic.get('cleanup') is True)
                  and all(isinstance(row.get('exit'), int) for row in runtime.get('fixtureCleanup', [])))
          results = {'schema': 1, 'qualificationGranted': False, 'experiments': []}
          tool = ['python3', '-B', 'tools/native-stage-decoupling/run.py']
          experiments = [('inventory', ['inventory']),
                         ('autohide', ['edge-sweep', '--enable-native', '--autohide']),
                         ('zero-rows', ['edge-sweep', '--enable-native', '--zero-rows'])]
          cleanup_failed = False
          for name, arguments in experiments:
              directory = output / name
              receipt = {'name': name, 'qualificationGranted': False}
              if name != 'inventory' and not safe:
                  receipt['result'] = {'status': 'NOT_RUN',
                      'reason': 'Independent Spaces cleanup was not positively confirmed.'}
                  results['experiments'].append(receipt)
                  continue
              with (output / (name + '.log')).open('w') as log:
                  try:
                      process = subprocess.run(tool + arguments + ['--output', str(directory)],
                                               stdout=log, stderr=subprocess.STDOUT, timeout=150)
                      receipt['exit'] = process.returncode
                  except subprocess.TimeoutExpired:
                      receipt['error'] = 'diagnosticTimeout'
                  finally:
                      if (directory / 'preferences-applied.json').exists() and (directory / 'preferences-original.json').exists():
                          try:
                              restored = subprocess.run(tool + ['restore', '--output', str(directory)],
                                                        stdout=log, stderr=subprocess.STDOUT, timeout=30)
                              receipt['restoreExit'] = restored.returncode
                              cleanup_failed = restored.returncode != 0
                          except subprocess.TimeoutExpired:
                              receipt['restoreError'] = 'restoreTimeout'
                              cleanup_failed = True
              result_file = directory / 'result.json'
              receipt['result'] = json.loads(result_file.read_text()) if result_file.exists() else {
                  'status': 'NOT_RUN', 'reason': 'Diagnostic produced no terminal receipt.'}
              results['experiments'].append(receipt)
              if cleanup_failed:
                  break
          results.update(status='UNKNOWN' if cleanup_failed else 'COLLECTED', cleanup=not cleanup_failed)
          (output / 'summary.json').write_text(json.dumps(results, indent=2) + '\n')
          sys.exit(1 if cleanup_failed else 0)
          PY
      - name: Preserve every terminal result and candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nearpane-independent-stage-${{ github.sha }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/independent-source/
            ${{ runner.temp }}/independent-runtime/
            ${{ runner.temp }}/native-stage-cloud/
            ${{ runner.temp }}/Nearpane-independent-candidate.zip
            ${{ runner.temp }}/Nearpane-independent-candidate.sha256
            ${{ runner.temp }}/Nearpane-independent-candidate.json
          if-no-files-found: warn
          retention-days: 30
