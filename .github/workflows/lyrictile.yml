name: LyricTile independent macOS candidate
on:
  push:
    branches: ['codex/lyrictile-*']
    paths:
      - '.github/workflows/lyrictile.yml'
      - 'Products/LyricTile/Package.swift'
      - 'Products/LyricTile/Package.resolved'
      - 'Products/LyricTile/Sources/**'
      - 'Products/LyricTile/Tests/**'
      - 'Products/LyricTile/CloudAcceptance/**'
      - 'Products/LyricTile/Tools/**'
      - 'Products/LyricTile/Scripts/**'
      - 'Products/LyricTile/Packaging/**'
      - 'Products/LyricTile/Resources/**'
      - 'Products/LyricTile/Vendor/**'
      - 'Products/LyricTile/Documentation/THIRD_PARTY_NOTICES.md'
      - 'Products/LyricTile/Documentation/PRIVACY.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lyrictile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native tests, bundle and production UI load
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: Products/LyricTile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record actual host and toolchain
        run: |
          mkdir -p dist/evidence
          { sw_vers; uname -m; xcodebuild -version; swift --version; git rev-parse HEAD; } | tee dist/evidence/host.txt
          security find-identity -v -p codesigning > dist/evidence/signing-identities.txt
          echo "LYRICTILE_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          echo "LYRICTILE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Resolve the pinned public packages
        env:
          LYRICTILE_PACKAGE_TOKEN: ${{ github.token }}
        run: |
          set +x
          # Some hosted Git transports challenge even public clones. Use the
          # existing read-only job token only for these two package URLs and
          # only in this process; never persist credentials or rewrite remotes.
          lyrictile_auth=$(printf 'x-access-token:%s' "$LYRICTILE_PACKAGE_TOKEN" | base64 | tr -d '\n')
          printf '::add-mask::%s\n' "$lyrictile_auth"
          lyrictile_config_count=${GIT_CONFIG_COUNT:-0}
          [[ "$lyrictile_config_count" =~ ^[0-9]+$ ]]
          for lyrictile_package in jpsim/Yams sparkle-project/Sparkle; do
            export "GIT_CONFIG_KEY_${lyrictile_config_count}=http.https://github.com/${lyrictile_package}.git.extraheader"
            export "GIT_CONFIG_VALUE_${lyrictile_config_count}=AUTHORIZATION: basic $lyrictile_auth"
            lyrictile_config_count=$((lyrictile_config_count + 1))
          done
          export GIT_CONFIG_COUNT=$lyrictile_config_count
          swift package resolve
          git diff --exit-code -- Package.resolved
      - name: Compile the independent app and native host facade
        id: compile
        run: |
          set -o pipefail
          swift build --product LyricTile 2>&1 | tee dist/evidence/swift-build.log
          swift build --target NearpaneLyricsModule 2>&1 | tee dist/evidence/host-module-build.log
      - name: Run risk-focused tests
        env:
          LYRICTILE_UI_EVIDENCE_DIR: ${{ github.workspace }}/Products/LyricTile/dist/evidence/layout
        run: |
          set -o pipefail
          swift test --parallel --xunit-output dist/evidence/test-results.xml 2>&1 | tee dist/evidence/swift-test.log
      - name: Validate the bilingual website and release manifest
        run: python3 Scripts/verify-website.py Website > dist/evidence/website-integrity.json
      - name: Preserve authored native layout fixtures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LyricTile-ui-${{ github.run_number }}
          path: Products/LyricTile/dist/evidence/layout
          if-no-files-found: warn
          retention-days: 30
      - name: Build independent candidate with real media helper
        id: bundle
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -o pipefail
          bash Scripts/build-app.sh 2>&1 | tee dist/evidence/build-app.log
      - name: Load the production native panel without fabricated playback
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 Scripts/run-native-smoke.py dist/LyricTile.app --output dist/evidence
      - name: Verify candidate ZIP, mounted DMG, versions and checksums
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          python3 Scripts/verify-release.py --app dist/LyricTile.app \
            --archive "dist/LyricTile-1.0.0-${LYRICTILE_BUILD_NUMBER}-candidate-${LYRICTILE_ARCH}.zip" \
            --dmg "dist/LyricTile-1.0.0-${LYRICTILE_BUILD_NUMBER}-candidate-${LYRICTILE_ARCH}.dmg" \
            --checksums dist/SHA256SUMS --expected-commit "$GITHUB_SHA" --minimum-build 36 \
            --mode candidate --output dist/evidence/release-integrity.json
      - name: Verify the actual private framework and packaged helper load
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 Scripts/verify-media-helper.py dist/LyricTile.app/Contents/Resources/MediaRemote --output dist/evidence/media-helper-load.json
      - name: Measure the ordinary candidate at idle on this host
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 Scripts/check-idle-runtime.py dist/LyricTile.app --output dist/evidence/idle --seconds 120
      - name: Verify real Music local playback without an account
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 Scripts/check-cloud-music.py dist/LyricTile.app --output dist/evidence/real-music
      - name: Preserve the actual Music result immediately
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LyricTile-music-${{ github.run_number }}
          path: Products/LyricTile/dist/evidence/real-music/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Probe the live lyric service with the production repository
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: swift run --configuration release LyricServiceProbe --output dist/evidence/live-lyrics.json
      - name: Verify one real public recording with automatic online lyrics
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 Scripts/check-cloud-online-song.py dist/LyricTile.app --output dist/evidence/real-online-song
      - name: Preserve the online song result immediately
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LyricTile-online-${{ github.run_number }}
          path: Products/LyricTile/dist/evidence/real-online-song/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Observe official QQ and NetEase clients without accounts
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 Scripts/check-cloud-clients.py dist/LyricTile.app --audio dist/evidence/real-music/original-chimes.wav --output dist/evidence/cloud-clients
      - name: Preserve candidate and verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LyricTile-candidate-${{ github.run_number }}
          path: |
            Products/LyricTile/dist/*.zip
            Products/LyricTile/dist/*.dmg
            Products/LyricTile/dist/SHA256SUMS
            Products/LyricTile/dist/bundle-verification.json
            Products/LyricTile/dist/evidence
            Products/LyricTile/Package.resolved
          if-no-files-found: error
          retention-days: 30

